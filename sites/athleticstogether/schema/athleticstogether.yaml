schema_version: "1.0.0"
framework_version: "0.1.0"
description: "Athletics Together — training planner, training log and virtual events"

enums:
  Sport:
    values: [run, ride, swim, walk, hike, row, ski, strength, other]
    default: run
    description: "Kind of activity"

  WorkoutType:
    values: [easy, long_run, tempo, intervals, hills, fartlek, recovery, race, cross_training, rest, other]
    default: easy
    description: "Purpose of a planned session"

  WorkoutStatus:
    values: [planned, completed, partial, skipped]
    default: planned
    description: "Whether a planned workout was done; set to completed when a matching activity is uploaded"

  Visibility:
    values: [private, public]
    default: private
    description: "private: only you; public: anyone, including people who are not signed in"

  ActivitySource:
    values: [manual, fit, gpx, tcx, csv]
    default: manual
    description: "Where an activity came from: typed in, or uploaded from a watch or timing system"

classes:

  Athlete:
    label: "Athlete"
    description: "A person using Athletics Together. Signing up creates one."
    display: display_name
    order_by: "display_name asc"
    auth: {login: email, password: password_hash, display: display_name}
    access: {owner: id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true, label: "ID"}
      - name: email
        type: string
        required: true
        hidden: true
        label: "Email"
        placeholder: "you@example.com"
        pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        max: 191
        ui_order: 1
      - name: password_hash
        type: password
        required: true
        label: "Password"
        description: "At least 10 characters"
        min: 10
        ui_order: 2
      - {name: display_name, type: string, required: true, label: "Display name", max: 60, ui_order: 3,
         description: "Shown on your public activities and on event leaderboards"}
      - {name: location, type: string, label: "Location", max: 100, placeholder: "e.g. Victoria, BC", ui_order: 4}
      - name: timezone
        type: string
        label: "Time zone"
        default: "America/Vancouver"
        placeholder: "e.g. America/Vancouver, Europe/London"
        description: "Used to put uploaded watch activities on the right day"
        max: 64
        ui_order: 5
      - {name: bio, type: text, label: "About", max: 2000, ui_order: 6}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, label: "Joined", ui_order: 99}
    constraints:
      unique: [email]

  TrainingPlan:
    label: "Training Plan"
    description: "A block of planned training, usually building to a goal race or event"
    display: name
    order_by: "start_date desc"
    access: {owner: athlete_id, read: owner, public_when: {visibility: public}}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true}
      - {name: athlete_id, type: integer, required: true, hidden: true}
      - {name: name, type: string, required: true, max: 120, label: "Plan name", placeholder: "e.g. Spring 10K build", ui_order: 1}
      - {name: goal, type: string, max: 200, label: "Goal", placeholder: "e.g. Sub-45 10K at the TC10K", ui_order: 2}
      - {name: start_date, type: date, required: true, label: "Starts", ui_order: 3}
      - {name: end_date, type: date, label: "Ends", ui_order: 4}
      - {name: description, type: text, label: "Notes", max: 10000, ui_order: 5}
      - {name: visibility, type: enum, enum: Visibility, default: private, label: "Visibility", ui_order: 6}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, ui_order: 98}
      - {name: updated_at, type: datetime, autogenerated: true, read_only: true, ui_order: 99}
    relationships:
      belongs_to:
        - {target: Athlete, via: athlete_id, label: "Athlete", on_delete: cascade}
      has_many:
        - {target: PlannedWorkout, via: plan_id, name: workouts, label: "Workouts", order_by: "date asc"}

  PlannedWorkout:
    label: "Planned Workout"
    description: "One session on the training calendar"
    display: title
    order_by: "date asc"
    calendar: date
    access: {owner: athlete_id, read: owner, public_when: {visibility: public}}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true}
      - {name: athlete_id, type: integer, required: true, hidden: true}
      - {name: plan_id, type: integer, hidden: true, label: "Training plan", ui_order: 1}
      - {name: date, type: date, required: true, label: "Date", ui_order: 2}
      - {name: title, type: string, required: true, max: 120, label: "Workout", placeholder: "e.g. 6 x 800m @ 5K pace", ui_order: 3}
      - {name: sport, type: enum, enum: Sport, default: run, label: "Sport", ui_order: 4}
      - {name: workout_type, type: enum, enum: WorkoutType, default: easy, label: "Type", ui_order: 5}
      - {name: target_distance_km, type: float, min: 0, max: 1000, label: "Target distance (km)", ui_order: 6, ui_group: "Targets"}
      - {name: target_duration, type: duration, min: 0, label: "Target time", ui_order: 7, ui_group: "Targets"}
      - {name: target_pace, type: string, max: 40, label: "Target pace", placeholder: "e.g. 4:30/km", ui_order: 8, ui_group: "Targets"}
      - {name: description, type: text, max: 5000, label: "Details", ui_order: 9}
      - {name: status, type: enum, enum: WorkoutStatus, default: planned, label: "Status", ui_order: 10}
      - {name: visibility, type: enum, enum: Visibility, default: private, label: "Visibility", ui_order: 11}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, ui_order: 99}
    relationships:
      belongs_to:
        - {target: Athlete, via: athlete_id, label: "Athlete", on_delete: cascade}
        - {target: TrainingPlan, via: plan_id, label: "Training plan", on_delete: cascade}
      has_many:
        - {target: Activity, via: planned_workout_id, name: activities, label: "Logged activities", order_by: "start_time asc"}
    constraints:
      indexes:
        - [athlete_id, date]

  Activity:
    label: "Activity"
    description: "A logged workout, typed in or uploaded from a watch (FIT, GPX, TCX) or timing system (CSV)"
    display: title
    order_by: "start_time desc"
    calendar: date
    access: {owner: athlete_id, read: owner, public_when: {visibility: public}}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true}
      - {name: athlete_id, type: integer, required: true, hidden: true}
      - {name: date, type: date, required: true, label: "Date", ui_order: 1}
      - {name: start_time, type: datetime, label: "Start time", ui_order: 2}
      - {name: title, type: string, required: true, max: 120, label: "Title", placeholder: "e.g. Morning Run", ui_order: 3}
      - {name: sport, type: enum, enum: Sport, default: run, label: "Sport", ui_order: 4}
      - {name: distance_km, type: float, min: 0, max: 2000, label: "Distance (km)", ui_order: 5, ui_group: "Totals"}
      - {name: duration, type: duration, min: 0, label: "Elapsed time", ui_order: 6, ui_group: "Totals"}
      - {name: moving_time, type: duration, min: 0, label: "Moving time", ui_order: 7, ui_group: "Totals"}
      - {name: elevation_gain_m, type: float, min: 0, label: "Elevation gain (m)", ui_order: 8, ui_group: "Totals"}
      - {name: avg_hr, type: integer, min: 20, max: 250, label: "Avg heart rate", ui_order: 9, ui_group: "Body"}
      - {name: max_hr, type: integer, min: 20, max: 250, label: "Max heart rate", ui_order: 10, ui_group: "Body"}
      - {name: avg_cadence, type: integer, min: 0, max: 300, label: "Avg cadence", ui_order: 11, ui_group: "Body"}
      - {name: calories, type: integer, min: 0, label: "Calories", ui_order: 12, ui_group: "Body"}
      - {name: perceived_effort, type: integer, min: 1, max: 10, label: "Effort (1–10)", ui_order: 13, ui_group: "Body"}
      - {name: planned_workout_id, type: integer, hidden: true, label: "Planned workout", ui_order: 14,
         description: "Filled automatically when an upload matches your plan for that day"}
      - {name: notes, type: text, max: 10000, label: "Notes", ui_order: 15}
      - {name: visibility, type: enum, enum: Visibility, default: private, label: "Visibility", ui_order: 16}
      - {name: source, type: enum, enum: ActivitySource, default: manual, read_only: true, label: "Source", ui_order: 90}
      - {name: device, type: string, max: 120, read_only: true, label: "Device", ui_order: 91}
      - {name: source_file, type: string, max: 255, read_only: true, label: "Uploaded file", ui_order: 92}
      - {name: source_hash, type: string, max: 64, hidden: true, read_only: true}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, ui_order: 99}
    relationships:
      belongs_to:
        - {target: Athlete, via: athlete_id, label: "Athlete", on_delete: cascade}
        - {target: PlannedWorkout, via: planned_workout_id, label: "Planned workout", on_delete: set_null}
      has_many:
        - {target: Lap, via: activity_id, name: laps, label: "Laps", order_by: "lap_number asc"}
    constraints:
      unique:
        - [athlete_id, source_hash]
      indexes:
        - [athlete_id, date]

  Lap:
    label: "Lap"
    description: "A lap or split of an activity"
    display: lap_number
    order_by: "lap_number asc"
    access: {parent: activity_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true}
      - {name: activity_id, type: integer, required: true, hidden: true, label: "Activity"}
      - {name: lap_number, type: integer, required: true, min: 1, label: "Lap", ui_order: 1}
      - {name: start_time, type: datetime, label: "Start", ui_order: 2}
      - {name: distance_km, type: float, min: 0, label: "Distance (km)", ui_order: 3}
      - {name: duration, type: duration, min: 0, label: "Time", ui_order: 4}
      - {name: moving_time, type: duration, min: 0, label: "Moving time", ui_order: 5}
      - {name: avg_hr, type: integer, min: 20, max: 250, label: "Avg HR", ui_order: 6}
      - {name: max_hr, type: integer, min: 20, max: 250, label: "Max HR", ui_order: 7}
      - {name: elevation_gain_m, type: float, min: 0, label: "Gain (m)", ui_order: 8}
    relationships:
      belongs_to:
        - {target: Activity, via: activity_id, label: "Activity", on_delete: cascade}

  Event:
    label: "Virtual Event"
    description: "A virtual race or challenge: complete the distance anywhere within the date window and post your result"
    display: name
    order_by: "start_date desc"
    calendar: start_date
    access: {owner: organizer_id, read: owner, public_when: {visibility: public}}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true}
      - {name: organizer_id, type: integer, required: true, hidden: true}
      - {name: name, type: string, required: true, max: 120, label: "Event name", placeholder: "e.g. November Virtual 10K", ui_order: 1}
      - {name: sport, type: enum, enum: Sport, default: run, label: "Sport", ui_order: 2}
      - {name: distance_km, type: float, min: 0, max: 1000, label: "Distance (km)",
         description: "Activities at least this long count. Leave blank for a time-based or open challenge.", ui_order: 3}
      - {name: start_date, type: date, required: true, label: "Opens", ui_order: 4}
      - {name: end_date, type: date, required: true, label: "Closes", ui_order: 5}
      - {name: description, type: text, max: 10000, label: "About the event", ui_order: 6}
      - {name: registration_open, type: boolean, default: true, label: "Registration open", ui_order: 7}
      - {name: visibility, type: enum, enum: Visibility, default: public, label: "Visibility", ui_order: 8}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, ui_order: 99}
    relationships:
      belongs_to:
        - {target: Athlete, via: organizer_id, label: "Organizer", on_delete: cascade}
      has_many:
        - {target: EventResult, via: event_id, name: results, label: "Leaderboard", order_by: "elapsed_time asc"}
        - {target: EventRegistration, via: event_id, name: registrations, label: "Registered athletes", order_by: "created_at asc"}

  EventRegistration:
    label: "Registration"
    description: "An athlete signed up for a virtual event"
    order_by: "created_at asc"
    access: {owner: athlete_id, parent: event_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true}
      - {name: event_id, type: integer, required: true, hidden: true, label: "Event", ui_order: 1}
      - {name: athlete_id, type: integer, required: true, hidden: true}
      - {name: team, type: string, max: 80, label: "Team or club", ui_order: 2}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, label: "Registered", ui_order: 99}
    relationships:
      belongs_to:
        - {target: Event, via: event_id, label: "Event", on_delete: cascade}
        - {target: Athlete, via: athlete_id, label: "Athlete", on_delete: cascade}
    constraints:
      unique:
        - [event_id, athlete_id]

  EventResult:
    label: "Result"
    description: "A finish posted to a virtual event — automatically when an uploaded activity qualifies, or by hand"
    order_by: "elapsed_time asc"
    access: {owner: athlete_id, parent: event_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true, required: true}
      - {name: event_id, type: integer, required: true, hidden: true, label: "Event", ui_order: 1}
      - {name: athlete_id, type: integer, required: true, hidden: true}
      - {name: activity_id, type: integer, hidden: true, label: "Activity", ui_order: 2,
         description: "The logged activity this result comes from"}
      - {name: elapsed_time, type: duration, required: true, min: 1, label: "Time", ui_order: 3}
      - {name: distance_km, type: float, min: 0, label: "Distance (km)", ui_order: 4}
      - {name: notes, type: string, max: 280, label: "Notes", ui_order: 5}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, label: "Posted", ui_order: 99}
    relationships:
      belongs_to:
        - {target: Event, via: event_id, label: "Event", on_delete: cascade}
        - {target: Athlete, via: athlete_id, label: "Athlete", on_delete: cascade}
        - {target: Activity, via: activity_id, label: "Activity", on_delete: set_null}
    constraints:
      unique:
        - [event_id, activity_id]
