{{define "content"}}{{$d := .Data}}
<div class="page-head"><h1>{{$d.Title}}</h1></div>
{{if $d.Message}}<p class="alert">{{$d.Message}}</p>{{end}}
<form method="post" action="{{$d.Action}}" class="form">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  {{range $d.Groups}}
  <fieldset>
    {{if .Name}}<legend>{{.Name}}</legend>{{end}}
    {{range .Fields}}{{template "field" .}}{{end}}
  </fieldset>
  {{end}}
  <div class="actions">
    <button class="btn" type="submit">{{$d.Submit}}</button>
    <a class="btn ghost" href="{{$d.Cancel}}">Cancel</a>
  </div>
</form>
{{end}}
