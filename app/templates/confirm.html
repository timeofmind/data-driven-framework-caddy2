{{define "content"}}{{$d := .Data}}
<div class="card narrow">
  <h1>{{.Title}}</h1>
  <p>{{$d.Message}}</p>
  <form method="post" action="{{$d.Action}}" class="actions">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <button class="btn danger" type="submit">{{$d.Submit}}</button>
    <a class="btn ghost" href="{{$d.Cancel}}">Cancel</a>
  </form>
</div>
{{end}}
