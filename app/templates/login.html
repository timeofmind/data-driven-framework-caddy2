{{define "content"}}{{$d := .Data}}
<div class="card narrow">
  <h1>Sign in</h1>
  {{if $d.Message}}<p class="alert">{{$d.Message}}</p>{{end}}
  <form method="post" action="{{.Base}}/login" class="form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{$d.Next}}">
    <div class="field"><label for="f-login">{{$d.LoginLabel}}</label><input id="f-login" type="email" name="login" value="{{$d.Login}}" required autocomplete="username" autofocus></div>
    <div class="field"><label for="f-pw">Password</label><input id="f-pw" type="password" name="password" required autocomplete="current-password"></div>
    <div class="actions"><button class="btn" type="submit">Sign in</button></div>
  </form>
  {{if .Signup}}<p class="muted">New here? <a href="{{.Base}}/signup">Create a free account</a>.</p>{{end}}
</div>
{{end}}
