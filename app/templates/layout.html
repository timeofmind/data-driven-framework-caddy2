{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} · {{end}}{{.Site}}</title>
<link rel="stylesheet" href="{{.Base}}/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{.Base}}/">{{.Site}}</a>
    <nav class="main-nav" aria-label="Main">
      {{if .P}}<a href="{{.Base}}/calendar"{{if eq2 .Path (printf "%s/calendar" .Base)}} class="active"{{end}}>Calendar</a>{{end}}
      {{range .Nav}}<a href="{{.URL}}"{{if .Active}} class="active"{{end}}>{{.Label}}</a>{{end}}
    </nav>
    <div class="account">
      {{if .P}}
        {{if .Upload}}<a class="btn small" href="{{.Upload.URL}}">Upload</a>{{end}}
        <a href="{{.Base}}/me">{{.P.Name}}</a>
        <form method="post" action="{{.Base}}/logout" class="inline">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          <button class="link" type="submit">Sign out</button>
        </form>
      {{else}}
        <a href="{{.Base}}/login">Sign in</a>
        {{if .Signup}}<a class="btn small" href="{{.Base}}/signup">Join free</a>{{end}}
      {{end}}
    </div>
  </div>
</header>
<main class="wrap">
{{template "content" .}}
</main>
<footer class="wrap foot">
  <span>{{.Site}}</span>
  <a href="{{.Base}}/api/v1/openapi.json">API</a>
</footer>
</body>
</html>{{end}}
