# Shared-library fixture: terrains (nesting, grouped by region) tag routes;
# outings re-use anyone's public route; every use is logged for ranking.
classes:
  Region:
    display: name
    access: {owner: created_by, read: public}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: created_by, type: integer}
      - {name: name, type: string, required: true}
  Terrain:
    display: name
    access: {owner: created_by, read: public}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: created_by, type: integer}
      - {name: region_id, type: integer, required: true, label: "Region"}
      - {name: parent_id, type: integer, label: "Under"}
      - {name: name, type: string, required: true}
    relationships:
      belongs_to:
        - {target: Region, via: region_id, on_delete: cascade, link: readable}
        - {target: Terrain, via: parent_id, on_delete: cascade, link: readable}
  RouteTerrain:
    display: terrain_id
    access: {parent: route_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: route_id, type: integer, required: true}
      - {name: terrain_id, type: integer, required: true, label: "Terrain"}
    relationships:
      belongs_to:
        - {target: Route, via: route_id, on_delete: cascade}
        - {target: Terrain, via: terrain_id, on_delete: cascade, link: readable}
    constraints: {unique: [[route_id, terrain_id]]}
  Outing:
    display: day
    access: {owner: member_id, read: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: member_id, type: integer, required: true}
      - {name: route_id, type: integer, label: "Route"}
      - {name: day, type: date, required: true}
    relationships:
      belongs_to:
        - {target: Member, via: member_id, on_delete: cascade}
        - {target: Route, via: route_id, on_delete: set_null, link: readable}
  RouteUse:
    access: {owner: member_id, read: owner, write: nobody}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: member_id, type: integer, required: true}
      - {name: route_id, type: integer, required: true}
      - {name: kind, type: enum, enum: UseKind, required: true}
      - {name: outing_id, type: integer}
      - {name: copy_id, type: integer}
    relationships:
      belongs_to:
        - {target: Member, via: member_id, on_delete: cascade}
        - {target: Route, via: route_id, on_delete: cascade}
        - {target: Outing, via: outing_id, on_delete: set_null}
        - {target: Route, via: copy_id, on_delete: set_null}
      has_many:
        - {target: RouteUseTerrain, via: use_id, name: searched}
  RouteUseTerrain:
    access: {parent: use_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: use_id, type: integer, required: true}
      - {name: terrain_id, type: integer, required: true}
    relationships:
      belongs_to:
        - {target: RouteUse, via: use_id, on_delete: cascade}
        - {target: Terrain, via: terrain_id, on_delete: cascade}
