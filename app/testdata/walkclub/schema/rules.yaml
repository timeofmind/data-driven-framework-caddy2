# Rules fixture: a trip's paths depend on its mode (options), its kit must be
# for that mode (match), and each stage is timed or by effort (when /
# required_when), with its path options read through the link to its trip.
enums:
  Mode: {values: [walk, cycle]}
  PathKind:
    values: [footpath, towpath, cycleway, road]
    labels: {towpath: "Canal towpath"}
  StageBy: {values: [time, effort]}
classes:
  Kit:
    title: "name + ' (' + mode + ')'"
    display: name
    access: {read: public, write: nobody}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: name, type: string, required: true}
      - {name: mode, type: enum, enum: Mode, required: true}
  Trip:
    display: name
    access: {owner: member_id, read: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: member_id, type: integer, required: true, hidden: true}
      - {name: name, type: string, required: true}
      - {name: mode, type: enum, enum: Mode}
      - name: path
        type: enum
        enum: PathKind
        options:
          - {when: "mode == 'walk'", values: [footpath, towpath]}
          - {when: "mode == 'cycle'", values: [cycleway, towpath, road]}
      - {name: kit_id, type: integer, label: "Kit"}
    relationships:
      belongs_to:
        - {target: Member, via: member_id, on_delete: cascade}
        - {target: Kit, via: kit_id, on_delete: set_null, link: readable, match: {mode: mode}}
      has_many:
        - {target: Stage, via: trip_id, name: stages, label: "Stages"}
  Stage:
    access: {parent: trip_id}
    checks:
      - {check: "km != null", message: "Give the stage's distance", slot: km}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: trip_id, type: integer, required: true, hidden: true}
      - {name: km, type: float}
      - {name: by, type: enum, enum: StageBy, default_expr: "if(trip.mode == 'cycle', 'time', 'effort')"}
      - {name: minutes, type: integer, when: "by == 'time'", required_when: "by == 'time'"}
      - {name: effort, type: integer, when: "by == 'effort'", required_when: "by == 'effort'"}
      - name: path
        type: enum
        enum: PathKind
        options:
          - {when: "trip.mode == 'walk'", values: [footpath, towpath]}
    relationships:
      belongs_to:
        - {target: Trip, via: trip_id, on_delete: cascade}
