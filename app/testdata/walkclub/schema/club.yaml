schema_version: "1.0.0"
description: "Walk Club fixture"
enums:
  Visibility: {values: [private, public], default: private}
  Pace: {values: [stroll, brisk, other], default: brisk}
  UseKind: {values: [planned, copied]}
classes:
  Member:
    display: name
    auth: {login: email, password: pw, display: name}
    access: {owner: id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: email, type: string, required: true, hidden: true, max: 191}
      - {name: pw, type: password, required: true, min: 10, label: "Password"}
      - {name: name, type: string, required: true, label: "Name"}
      - {name: tz, type: string, default: "America/Vancouver"}
    constraints: {unique: [email]}
  Route:
    display: name
    access: {owner: member_id, read: owner, public_when: {visibility: public}}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: member_id, type: integer, required: true, hidden: true}
      - {name: name, type: string, required: true}
      - {name: distance_km, type: float, min: 0}
      - {name: last_walked, type: date, read_only: true}
      - {name: visibility, type: enum, enum: Visibility, default: private}
      - {name: based_on_id, type: integer, label: "Based on"}
    relationships:
      belongs_to:
        - {target: Member, via: member_id, on_delete: cascade}
        - {target: Route, via: based_on_id, on_delete: set_null, link: readable}
      has_many:
        - {target: RouteTerrain, via: route_id, name: terrains, label: "Terrain", add_label: "Add terrain"}
    filters:
      - {name: terrain, label: "Terrain", via: terrains, slot: terrain_id, include_children: parent_id, group_by: region_id, rank_by_usage: true}
    actions:
      - {name: copy, label: "Copy route", copy: [terrains], set: {based_on_id: source.id, visibility: "'private'"}, when: "visibility == 'public'"}
    usage:
      log: RouteUse
      via: route_id
      kind: kind
      filter: terrain
      values: searched
      uses:
        - {kind: planned, link: Outing.route_id, record: outing_id}
        - {kind: copied, action: copy, record: copy_id}
  Walk:
    display: title
    calendar: day
    calendar_label: "title + ' · ' + round(distance_km, 1) + ' km'"
    order_by: "day desc"
    access: {owner: member_id, read: owner, public_when: {visibility: public}}
    computed:
      - {name: pace, label: "Pace", expr: "coalesce(moving, duration) / distance_km", format: duration, suffix: " /km"}
    triggers:
      - via: route_id
        set: {last_walked: "self.day"}
    import:
      formats: [gpx, fit, csv]
      dedupe: source_hash
      timezone: "owner.tz"
      fields:
        day: date_local
        title: title
        distance_km: distance_km
        duration: elapsed_s
        moving: moving_s
        kind: sport
        source_hash: file_hash
      fallback: {kind: other}
      children:
        - {relationship: legs, from: laps, min: 2, fields: {n: index, distance_km: distance_km, duration: elapsed_s}}
      link:
        - via: route_id
          where: {member_id: self.member_id}
          if: "item.distance_km != null and abs(item.distance_km - self.distance_km) <= item.distance_km * 0.1"
      create:
        - class: BestTime
          from: {class: Attendance, where: {member_id: self.member_id}, follow: meetup_id}
          if: "item.day == self.day"
          unique: [meetup_id, walk_id]
          set: {meetup_id: item.id, walk_id: self.id, time: "coalesce(self.moving, self.duration)"}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: member_id, type: integer, required: true, hidden: true}
      - {name: route_id, type: integer, hidden: true, label: "Route"}
      - {name: day, type: date, required: true}
      - {name: title, type: string, required: true, max: 40}
      - {name: kind, type: enum, enum: Pace, default: brisk}
      - {name: distance_km, type: float, min: 0}
      - {name: duration, type: duration}
      - {name: moving, type: duration}
      - {name: visibility, type: enum, enum: Visibility, default: private}
      - {name: source_hash, type: string, hidden: true, read_only: true, max: 64}
    relationships:
      belongs_to:
        - {target: Member, via: member_id, on_delete: cascade}
        - {target: Route, via: route_id, on_delete: set_null}
      has_many:
        - {target: Leg, via: walk_id, name: legs, label: "Legs", order_by: "n asc"}
    constraints: {unique: [[member_id, source_hash]]}
  Leg:
    access: {parent: walk_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: walk_id, type: integer, required: true, hidden: true}
      - {name: n, type: integer, required: true}
      - {name: distance_km, type: float}
      - {name: duration, type: duration}
    relationships:
      belongs_to: [{target: Walk, via: walk_id, on_delete: cascade}]
  Meetup:
    display: title
    calendar: day
    access: {owner: organizer_id, read: public}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: organizer_id, type: integer, required: true, hidden: true}
      - {name: title, type: string, required: true}
      - {name: day, type: date, required: true}
      - {name: open, type: boolean, default: true, label: "Open"}
    relationships:
      belongs_to: [{target: Member, via: organizer_id, label: "Organizer", on_delete: cascade}]
      has_many:
        - {target: BestTime, via: meetup_id, name: times, label: "Best times", order_by: "time asc", rank: {best_per: member_id}}
        - {target: Attendance, via: meetup_id, name: attendees, label: "Attending", add_label: "Attend", add_when: "open"}
  Attendance:
    access: {owner: member_id, parent: meetup_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: meetup_id, type: integer, required: true, hidden: true}
      - {name: member_id, type: integer, required: true, hidden: true}
      - {name: note, type: string}
    relationships:
      belongs_to:
        - {target: Meetup, via: meetup_id, on_delete: cascade}
        - {target: Member, via: member_id, on_delete: cascade}
    constraints: {unique: [[meetup_id, member_id]]}
  BestTime:
    access: {owner: member_id, parent: meetup_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: meetup_id, type: integer, required: true, hidden: true}
      - {name: member_id, type: integer, required: true, hidden: true}
      - {name: walk_id, type: integer, hidden: true}
      - {name: time, type: duration, required: true}
    relationships:
      belongs_to:
        - {target: Meetup, via: meetup_id, on_delete: cascade}
        - {target: Member, via: member_id, label: "Member", on_delete: cascade}
        - {target: Walk, via: walk_id, on_delete: set_null}
