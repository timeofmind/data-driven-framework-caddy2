to: "{{.member.email}}"
subject: "Reset your Walk Club password"
body: |
  Hello {{.member.name}},

  Someone asked to reset the password of your Walk Club account. If it was you,
  choose a new password here:

  {{.base_url}}/reset?code={{.record.code}}

  The link is good for an hour. If it wasn't you, ignore this message.
